# harness/rules.yaml — 판정 규칙 SSOT
# 수치·허용 목록은 이 파일에만 둔다. 가이드·에이전트는 이 값을 가리키기만 한다.
version: 1

purpose: >
  화면 주제 1개를 받아, PRD 16장 핵심 화면 중 그 주제에 해당하는 모든 화면을
  템플릿 Figma 파일의 주제 페이지에 390×844 프레임으로 만든다.
  design.md 위반 0건, ★1·★2 위반 0건, 팀장 승인 1건이면 완료.

docs:
  prd: docs/prd.md
  design: docs/design.md
  story_service: docs/story-service.md
  story_work: docs/story-work.md

run:
  root: runs/<slug>/          # slug = 주제 영문 kebab-case
  state: runs/<slug>/state.json     # 스크립트만 쓴다
  approval: runs/<slug>/approval.md # 사람만 쓴다
  resumable: true
  frame: { width: 390, height: 844 }

stages:
  - id: P1
    name: 리서치
    work_steps: [1, 2]
    inputs: [topic, docs/prd.md]
    outputs:
      - runs/<slug>/p1-research/references.md
      - runs/<slug>/p1-research/insights.md
    tools: [uibowl]
  - id: P2
    name: 설계
    work_steps: [3]
    inputs: [P1, docs/story-service.md]
    outputs: [runs/<slug>/p2-design/screens.md]
  - id: P3
    name: 키스크린
    work_steps: [4]
    inputs: [P2, docs/design.md]
    outputs: [runs/<slug>/p3-keyscreens/keyscreens.md]
    tools: [figma]
  - id: HUMAN
    name: 컨셉 확정
    work_steps: [5]
    inputs: [P2, P3]
    outputs: [runs/<slug>/approval.md]
    approver: 팀장
  - id: P4
    name: 시스템
    work_steps: [6]
    inputs: [P3, HUMAN, docs/design.md]
    outputs:
      - runs/<slug>/p4-system/tokens.json
      - runs/<slug>/p4-system/components.md
    tools: [figma]
  - id: P5
    name: 화면 디자인
    work_steps: [6]
    inputs: [P2, P4]
    outputs: [runs/<slug>/p5-screens/screens.md]
    tools: [figma]

returns:
  - { from: HUMAN, on: rejected, to: P2 }
  - { from: P2, on: screen_without_insight, to: P1 }  # 반영 포인트 0개인 화면이 1개 이상
  - { from: any, on: gate_fail, to: self }            # 재시도 한도는 R5에서

templates:
  dir: harness/templates/
  files: [references.md, insights.md, screens.md]

templates_columns:            # 게이트가 세는 표의 열 이름 (고정)
  references:  [번호, 서비스, 화면, UI Bowl URL]
  insights:    [번호, 반영 포인트, 출처 번호]
  screens:     [화면, 관련 US, 반영 포인트 번호, 구성, 공개 범위 기본값]
  transitions: [from, to]     # screens.md 안의 판매 신청 상태 전이 표
  keyscreens:  [화면, node id]
  components:  [컴포넌트, node id]
  screens_built: [화면, node id]

gates:
  retry_limit: 3              # 같은 게이트 3회 실패 → 차단(exit 3)

  P1:
    references_min: 5
    reference_url_pattern: "^https://(www\\.)?uibowl\\.io/"   # 추정값 — 실제 링크 형식 확인 필요
    insights_min: 3
    insight_source_min: 1

  P2:
    screens_min: 1
    screen_names_allowed: [홈, 무료 학습자료, 유료 멤버 자료실, 스킬 라이브러리,
      미션 상세, 제출 화면, 내 학습, 내 자산, 자산 상세, 운영자 검수 화면]
    us_allowed: [US-1, US-2, US-3, US-4, US-5]
    us_per_screen_min: 1
    insight_per_screen_min: 1          # 0개 화면 → P1로 복귀
    star1_private_default:             # ★1 멤버 자료는 기본 비공개
      column: 공개 범위 기본값
      field_keyword: 공개 범위          # 구성 열에 이 말이 있으면 기본값 필수
      required_value: 비공개
      sale_option: 판매 신청
      sale_option_marker: seller 전용
    star2_review_required:             # ★2 판매 자산은 검수 통과 필수
      applies_to_screens: [내 자산, 자산 상세, 운영자 검수 화면]
      required_states: [검수 대기]
      forbidden_transitions: [[임시저장, 승인됨]]
    out_of_scope:
      column: 구성                      # 이 열에서만 검사
      keywords: [허들링 픽, 판매 중, 판매 중지, 구매, 결제, 정산, 판매 수익,
        미션 피드백, AI 1차 검수, 실시간 채팅, 커뮤니티 피드, 리뷰, 평점,
        자동 추천, 오픈마켓]
      max: 0

  P3:
    keyscreens: { min: 2, max: 3, all_if_screens_lte: 2 }
    snapshot: p3-keyscreens/figma-snapshot.json
    design_check: true

  HUMAN:
    file: approval.md
    request_file: approval-request.md  # P3 통과 시 스크립트가 해시와 함께 작성
    accept: "^승인$"
    reject: "^반려: .+"
    hash_inputs: [p2-design/screens.md, p3-keyscreens/keyscreens.md]

  P4:
    snapshot: p4-system/figma-snapshot.json
    design_check: true
    requires_approval: true

  P5:
    snapshot: p5-screens/figma-snapshot.json
    design_check: true
    requires_approval: true
    all_screens_from_P2: true

design_check:                           # docs/design.md에서 뽑은 허용 목록
  frame: { width: 390, height: 844 }
  colors: ["#141414", "#262626", "#707070", "#adadad", "#ffffff",
           "#f3f3f3", "#f0f0f0", "#e0e0e0", "#0066ff",
           "rgba(115,115,115,0.56)"]
  accent: { color: "#0066ff", max_per_frame: 2, forbidden_on_suffix: ".cta" }
  radius: [0, 16, 24, 9999]
  radius_exceptions: [{ prefix: app-icon, ratio: 0.3 }]   # 한 변의 30%
  cta: { suffix: ".cta", radius: 9999, min_height: 44 }
  spacing: [0, 4, 8, 12, 16, 24, 32, 48, 64]              # 0은 간격 없음
  font_family: [Pretendard, Noto Sans KR]
  letter_spacing: [0]
  typography:                           # [size, weight, lineHeight]
    - [32, 700, 1.3]   # display
    - [28, 700, 1.3]   # heading-1
    - [24, 700, 1.35]  # heading-2
    - [20, 700, 1.35]  # heading-3
    - [18, 700, 1.35]  # heading-4
    - [17, 600, 1.4]   # title
    - [17, 300, 1.5]   # body-lg
    - [15, 400, 1.5]   # body
    - [13, 400, 1.5]   # body-sm
    - [15, 600, 1.5]   # link
    - [12, 600, 1.4]   # label
    - [12, 400, 1.4]   # caption
  shadows: { max: 0, exceptions: [segmented-control-active] }
